[package]
name = "multirecorder"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
env_logger = "0.11.11"
flacenc = "0.5.1"
fs4 = "1.1.0"
log = "0.4.34"
memory-stats = "1.2.0"
rfd = "0.17.2"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
claxon = "0.4.3"
hound = "3.5.1"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"

# Recording individual apps (process loopback); used only by the helper process.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# `#[implement]` (a COM callback object) refers to this crate by name.
windows-core = "0.62.2"
