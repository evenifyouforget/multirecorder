[package]
name = "multirecorder"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
env_logger = "0.11.11"
flacenc = "0.5.1"
log = "0.4.34"
rfd = "0.17.2"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
claxon = "0.4.3"
hound = "3.5.1"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
