name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: multirecorder-${{ runner.os }}
          path: |
            target/release/multirecorder
            target/release/multirecorder.exe

  # Same path as building from the devcontainer: cross-compile the Windows exe from Linux.
  cross-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: multirecorder-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/multirecorder.exe

  # Public download links that need no GitHub login and don't expire: every push
  # to main replaces the files of the "dev" pre-release and moves its tag.
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, cross-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir dist
          cp artifacts/multirecorder-windows-gnu/multirecorder.exe dist/multirecorder-windows.exe
          # Artifacts lose the executable bit; tar keeps it for users.
          for os in Linux macOS; do
            chmod +x "artifacts/multirecorder-$os/multirecorder"
            tar -czf "dist/multirecorder-${os,,}.tar.gz" -C "artifacts/multirecorder-$os" multirecorder
          done
          ls -l dist
      - name: Update dev pre-release
        run: |
          notes="Development build of $GITHUB_SHA ($(date -u '+%Y-%m-%d %H:%M UTC')), updated on every change to main. Not tested beyond CI; tested versions are the numbered releases."
          if gh release view dev >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true
            gh release upload dev dist/* --clobber
            gh release edit dev --prerelease --title "Development build" --notes "$notes"
          else
            gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title "Development build" --notes "$notes"
          fi
